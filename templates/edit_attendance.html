<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Attendance</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="sidebar">

            <h2>🎓 ERP Lite</h2>

            <a href="/dashboard">🏠 Dashboard</a>
            <a href="/students">👨‍🎓 Students</a>
            <a href="/courses">📚 Courses</a>
            <a href="/fees">💰 Fees</a>
            <a href="/attendance">📅 Attendance</a>
            <a href="#">📊 Results</a>
            <a href="/change-admin">🔐 Change Username & Password</a>
            <a href="/logout">🚪 Logout</a>

        </div>

        <div class="content">

            <h1>✏️ Edit Attendance</h1>

            <form method="POST">

                <input type="text" name="student_name" value="{{ attendance[1] }}" required><br><br>

                <input type="text" name="roll" value="{{ attendance[2] }}" required><br><br>

                <input type="date" name="attendance_date" value="{{ attendance[3] }}" required><br><br>

                <select name="status">

                    <option value="Present" {% if attendance[4]=="Present" %}selected{% endif %}>
                        ✅ Present
                    </option>

                    <option value="Absent" {% if attendance[4]=="Absent" %}selected{% endif %}>
                        ❌ Absent
                    </option>

                </select>

                <br><br>

                <button type="submit">💾 Update Attendance</button>

            </form>

            <br>

            <a href="/attendance">
                <button>⬅ Back</button>
            </a>

        </div>

    </div>

</body>

</html>
