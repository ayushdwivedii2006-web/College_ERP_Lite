<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Course</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <!-- SIDEBAR -->
        <div class="sidebar">

            <h2>🎓 ERP Lite</h2>

            <a href="/dashboard">🏠 Dashboard</a>
            <a href="/students">👨‍🎓 Students</a>
            <a href="/courses">📚 Courses</a>
            <a href="/change-admin">🔐 Change Username & Password</a>
            <a href="#">📅 Attendance</a>
            <a href="#">💰 Fees</a>
            <a href="#">📊 Results</a>
            <a href="/logout">🚪 Logout</a>

        </div>

        <!-- CONTENT -->
        <div class="content">

            <h1>✏️ Edit Course</h1>

            <form method="POST">

                <input type="text" name="course_name" value="{{ course[1] }}" required><br><br>

                <input type="text" name="course_code" value="{{ course[2] }}" required><br><br>

                <input type="text" name="duration" value="{{ course[3] }}" required><br><br>

                <input type="text" name="fees" value="{{ course[4] }}" required><br><br>

                <button type="submit">
                    Update Course
                </button>

                <a href="/courses">
                    <button type="button">
                        Back
                    </button>
                </a>

            </form>

        </div>

    </div>

</body>

</html>
