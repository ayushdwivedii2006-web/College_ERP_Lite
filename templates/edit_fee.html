<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Edit Fee</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <div class="sidebar">

            <h2>🎓 ERP Lite</h2>

            <a href="/dashboard">🏠 Dashboard</a>
            <a href="/students">👨‍🎓 Students</a>
            <a href="/courses">📚 Courses</a>
            <a href="/fees">💰 Fees</a>
            <a href="/change-admin">🔐 Change Username & Password</a>
            <a href="#">📅 Attendance</a>
            <a href="#">📊 Results</a>
            <a href="/logout">🚪 Logout</a>

        </div>

        <div class="content">

            <h1>✏️ Edit Fee</h1>

            <form method="POST">

                <input type="text" name="student_name" value="{{ fee[1] }}" required><br><br>

                <input type="text" name="roll" value="{{ fee[2] }}" required><br><br>

                <input type="number" name="total_fee" value="{{ fee[3] }}" required><br><br>

                <input type="number" name="paid_fee" value="{{ fee[4] }}" required><br><br>

                <button type="submit">
                    Update Fee
                </button>

                <a href="/fees">
                    <button type="button">
                        Back
                    </button>
                </a>

            </form>

        </div>

    </div>

</body>

</html>
